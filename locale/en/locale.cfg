[mod-setting-description]
ctt-vanilla-research-before-space-age=Reverts the Trigger Research on Nauvis to their old versions (Uranium Processing, Oil Processing, Steel Axe). While researching the previously researched technologies when the game begun. Like electric miners, electronics etc...
ctt-vanilla-research-replace=Disables the Oil Gathering and Uranium Mining technologies, and merges their recipes/results into the main research for those technologies.
ctt-pre-research-vulcanus=Researches the Vulcanus trigger technologies on new saves (Calcite processing, Tungsten carbide, Foundry, Big mining drill, Tungsten steel, Metallurgic science pack) and the technologies needed to craft their ingredients (Concrete, Lubricant, Electric engine, Advanced circuit...). Useful for starting on Vulcanus. Requires Space Age.
ctt-pre-research-gleba=Researches the Gleba trigger technologies on new saves (Agriculture, Yumako, Jellynut, Biochamber, Artificial soil, Bioflux, Bacteria cultivation, Bioflux processing, Agricultural science pack, Heating tower) and the technologies needed to craft their ingredients (Landfill, Concrete...). Useful for starting on Gleba. Requires Space Age.
ctt-pre-research-fulgora=Researches the Fulgora trigger technologies on new saves (Holmium processing, Electromagnetic plant, Electromagnetic science pack) and the technologies needed to craft their ingredients (Recycling, Battery, Accumulators, Concrete...). Useful for starting on Fulgora. Requires Space Age.
ctt-pre-research-aquilo=Researches the Aquilo trigger technologies on new saves (Lithium processing, Cryogenic plant, Cryogenic science pack). Also includes everything from the Vulcanus, Gleba and Fulgora settings, as Aquilo needs all of them. Useful for starting on Aquilo. Requires Space Age.
