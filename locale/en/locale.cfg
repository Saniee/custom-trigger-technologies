[mod-setting-description]
ctt-vanilla-research-before-space-age=Reverts the Trigger Research on Nauvis to their old versions (Uranium Processing, Oil Processing, Steel Axe). While researching the previously researched technologies when the game begun. Like electric miners, electronics etc...
ctt-replace-technologies=Disables the secondary technologies and merges their recipes/results into the main technology. Oil Gathering and Uranium Mining go into Oil Processing and Uranium Processing (needs the revert setting). With Space Age, the planet trigger technologies (except the science pack ones) go into the planet discovery technology, and technologies that required them require the discovery instead.
ctt-pre-research-vulcanus=On new saves, researches the Vulcanus discovery technology and the technologies needed to craft its ingredients (Concrete, Lubricant, Electric engine, Advanced circuit...), so you are not locked out when starting there. Without the merge setting, also researches the Vulcanus trigger technologies (not the science pack one). Useful for starting on Vulcanus. Requires Space Age.
ctt-pre-research-gleba=On new saves, researches the Gleba discovery technology and the technologies needed to craft its ingredients (Landfill, Concrete...), so you are not locked out when starting there. Without the merge setting, also researches the Gleba trigger technologies (not the science pack one). Useful for starting on Gleba. Requires Space Age.
ctt-pre-research-fulgora=On new saves, researches the Fulgora discovery technology and the technologies needed to craft its ingredients (Recycling, Battery, Accumulators, Concrete...), so you are not locked out when starting there. Without the merge setting, also researches the Fulgora trigger technologies (not the science pack one). Useful for starting on Fulgora. Requires Space Age.
ctt-pre-research-aquilo=Researches the Aquilo trigger technologies on new saves (Lithium processing, Cryogenic plant, Cryogenic science pack). Also includes everything from the Vulcanus, Gleba and Fulgora settings, as Aquilo needs all of them. Useful for starting on Aquilo. Requires Space Age.
